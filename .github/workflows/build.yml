name: framework
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - run: dotnet restore AntMind.sln --locked-mode
      - run: dotnet build AntMind.sln --no-restore
      - run: dotnet run --project tools/AntMind.Checks --no-build
      - run: dotnet publish src/AntMind.Desktop -c Release -r win-x64 --self-contained true -o artifacts/desktop
  # headless Linux 移植：只构建/验证不依赖 Avalonia 的三工程（WXT 选定「去掉桌面」）
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      # 锁文件对 RID 敏感：Linux job 不用 --locked-mode，整仓 restore 会补齐 linux-x64 段
      - run: dotnet restore AntMind.sln
      - run: dotnet build tools/AntMind.Checks/AntMind.Checks.csproj -c Debug --no-restore
      - run: dotnet build tools/AntMind.Evaluator/AntMind.Evaluator.csproj -c Debug --no-restore
      - run: dotnet build src/AntMind.Mcp/AntMind.Mcp.csproj -c Debug --no-restore
      - run: dotnet run --project tools/AntMind.Checks -c Debug --no-build
